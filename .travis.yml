sudo: false

language: php

php:
    - 7.2
    - 7.3
    - 7.4

env:
    # WordPress 5.9-6.9 support PHPUnit 8; WordPress 7.0+ requires PHPUnit 9.
    - WP_VERSION=6.9 WP_MULTISITE=0
    - WP_VERSION=6.9 WP_MULTISITE=1
    - WP_VERSION=5.9 WP_MULTISITE=0
    - WP_VERSION=5.9 WP_MULTISITE=1

matrix:
    include:
        # WordPress 5.8 requires PHPUnit 7. The security-blocking override is
        # limited to this test-only, end-of-life PHPUnit dependency.
        - php: 7.4
          env: WP_VERSION=5.8.17 WP_MULTISITE=0 PHPUNIT_VERSION=7.5.20
          install:
              - COMPOSER_NO_AUDIT=1 COMPOSER_NO_SECURITY_BLOCKING=1 composer update --no-interaction --prefer-dist --with-all-dependencies "phpunit/phpunit:${PHPUNIT_VERSION}"

install:
    - composer install --no-interaction --prefer-dist

before_script:
    - bash bin/install-wp-tests.sh wordpress_test root '' localhost $WP_VERSION

script: ./vendor/bin/phpunit
